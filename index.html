<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of repositories starred on GitHub.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">GitHub activity</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of the repositories I've starred.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <div class="list-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <p id="status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
  </body>
</html>
